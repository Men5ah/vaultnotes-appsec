<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>VaultNotes</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; color: #222; }
        nav { margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid #ccc; }
        nav a { margin-right: 15px; }
        .note { border: 1px solid #ddd; padding: 10px; margin-bottom: 10px; border-radius: 4px; }
        .flash { background: #fff3cd; padding: 8px; margin-bottom: 10px; border-radius: 4px; }
        input, textarea { width: 100%; padding: 6px; margin-bottom: 10px; box-sizing: border-box; }
        button { padding: 6px 14px; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ddd; padding: 6px; text-align: left; }
    </style>
</head>
<body>
    <nav>
        <a href="{{ url_for('notes.list_notes') }}">Notes</a>
        {% if session.get('is_admin') %}
            <a href="{{ url_for('admin.dashboard') }}">Admin</a>
        {% endif %}
        <a href="{{ url_for('auth.logout') }}">Logout</a>
    </nav>
    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for m in messages %}<div class="flash">{{ m }}</div>{% endfor %}
        {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
</body>
</html>
