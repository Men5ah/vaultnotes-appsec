<!doctype html>
<html>
<head><meta charset="utf-8"><title>Login - VaultNotes</title>
<style>body{font-family:sans-serif;max-width:400px;margin:80px auto;} input{width:100%;padding:6px;margin-bottom:10px;box-sizing:border-box;} .flash{background:#fff3cd;padding:8px;margin-bottom:10px;}</style>
</head>
<body>
<h1>VaultNotes Login</h1>
{% with messages = get_flashed_messages() %}
    {% if messages %}{% for m in messages %}<div class="flash">{{ m }}</div>{% endfor %}{% endif %}
{% endwith %}
<form method="post">
    <label>Username</label>
    <input type="text" name="username" required>
    <label>Password</label>
    <input type="password" name="password" required>
    <button type="submit">Log In</button>
</form>
<p>No account? <a href="{{ url_for('auth.register') }}">Register</a></p>
</body>
</html>
